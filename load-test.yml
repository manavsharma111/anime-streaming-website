config:
  target: "https://anime-streaming-website-q60l.onrender.com" # Directly testing your live Render server!
  phases:
    - name: "Raw Stress Test (10s)"
      duration: 10
      arrivalRate: 50

scenarios:
  - name: "Real User Browsing Journey"
    flow:
      # Step 1: User loads the homepage and fetches latest animes
      - get:
          url: "/api/anime?limit=12&sort=latest"
          capture:
            - json: "$.data[0]._id"
              as: "firstAnimeId"
      
      # Step 2: User scrolls and loads popular animes
      - get:
          url: "/api/anime?limit=10&sort=popular"
      
      # Step 3: User clicks on the first anime from the homepage to see details
      - get:
          url: "/api/anime/{{ firstAnimeId }}"
          ifTrue: "firstAnimeId"
